[data-theme=elegant]{--paper:#fffdf8;--ink:#34302d;--alt:#f3eee5;--accent:#b49a68;--accent2:#e3d4b4;--cover:#292724;--cover2:#403a32;--coverfg:#fffdf8;--seal:#b49a68;--muted:#777066;--btn:#292724;--btnfg:#fff;--serif:'Cormorant Garamond',Georgia,serif}
[data-theme=passport]{--paper:#f8f5eb;--ink:#263a35;--alt:#e8eee6;--accent:#b48b52;--accent2:#d9c7a4;--cover:#183b35;--cover2:#28534a;--coverfg:#f7ecd2;--seal:#c6a15e;--muted:#66756c;--btn:#183b35;--btnfg:#fff;--serif:'DM Serif Display',Georgia,serif}
[data-theme=storybook]{--paper:#fff9ed;--ink:#47352a;--alt:#f3e5c9;--accent:#b77b42;--accent2:#dfc18a;--cover:#4a2f28;--cover2:#68453a;--coverfg:#fff3d7;--seal:#c49a50;--muted:#786451;--btn:#68453a;--btnfg:#fff;--serif:'Fraunces',Georgia,serif}
[data-theme=dino]{--paper:#f8ffed;--ink:#263f36;--alt:#e3f2cf;--accent:#e58a3a;--accent2:#a9c96b;--cover:#244b3b;--cover2:#386b4d;--coverfg:#fff9dc;--seal:#e58a3a;--muted:#5b755d;--btn:#386b4d;--btnfg:#fff;--serif:'Fredoka',system-ui,sans-serif;--sans:'Nunito',system-ui,sans-serif}
[data-theme=collegiate]{--paper:#fbfaf6;--ink:#1b2a4e;--alt:#e9ecf4;--accent:#b8902f;--accent2:#e0c77f;--cover:#1b2a4e;--cover2:#26396a;--coverfg:#fbfaf6;--seal:#b8902f;--muted:#5a6480;--btn:#1b2a4e;--btnfg:#fff;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--paper);line-height:1.7;overflow-x:hidden}
body.locked{overflow:hidden}
h1,h2{font-family:var(--disp,var(--serif));font-weight:400}
html[data-font=script] h1{font-size:clamp(3.6rem,16vw,6.6rem)!important}
html[data-font=script] h2{font-size:2.6rem!important}
section{padding:84px 24px;text-align:center;position:relative}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:2}
h2{font-size:2.1rem;margin-bottom:26px}
h2:after{content:"";display:block;width:56px;height:1px;background:var(--accent);margin:14px auto 0}
p{margin-bottom:12px}
.alt-bg{background:var(--alt)}
/* cover */
#cover{position:fixed;inset:0;z-index:50;background:var(--cover);color:var(--coverfg);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity 1s;overflow:hidden}
#cover.gone{opacity:0;pointer-events:none}
#cover.doorsmode{background:none;padding:0;display:block}
.door{position:absolute;top:0;bottom:0;width:50%;background:var(--cover);transition:transform 1.4s cubic-bezier(.7,0,.2,1)}
.door.l{left:0}.door.r{right:0;background:var(--cover2)}
.curtain .door{background:repeating-linear-gradient(90deg,var(--seal) 0 26px,color-mix(in srgb,var(--seal) 70%,#000) 26px 52px)}
.open .door.l{transform:translateX(-100%)}.open .door.r{transform:translateX(100%)}
.center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;transition:opacity .5s}
.open .center{opacity:0}
.for{font-family:var(--serif);font-style:italic;font-size:1.35rem;margin-bottom:26px}
.tap{margin-top:22px;font-size:.95rem;letter-spacing:.04em;opacity:.8}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.cbtn{background:none;border:0;cursor:pointer;color:inherit;font:inherit}
.cbtn:focus-visible{outline:3px solid var(--accent);outline-offset:6px}
.cracked{animation:crack .5s forwards!important}
@keyframes crack{to{transform:scale(1.25) rotate(14deg);opacity:0}}
.openbtn{padding:14px 30px;border:1px solid var(--coverfg);border-radius:2px;font-size:1.05rem}
.gift{position:relative;width:170px;height:170px;margin-top:10px}
.gift .bx{position:absolute;bottom:0;left:10px;right:10px;height:110px;background:var(--seal);border-radius:4px}
.gift .bx:after,.gift .lid:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:var(--accent)}
.gift .lid{position:absolute;top:22px;left:0;right:0;height:46px;background:color-mix(in srgb,var(--seal) 85%,#fff);border-radius:4px;transition:transform .9s cubic-bezier(.3,1.6,.5,1),opacity .9s}
.gift.pop .lid{transform:translateY(-130px) rotate(-22deg);opacity:0}
.sc{position:relative;width:300px;height:180px;border-radius:8px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sc .under{position:absolute;inset:0;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.sc .under b{font:400 1.7rem var(--serif)}
.sc canvas{position:absolute;inset:0;touch-action:none;transition:opacity .8s;cursor:crosshair}
.bl{position:relative;width:150px;height:190px;animation:bob 3s ease-in-out infinite}
.bl i{position:absolute;inset:0 0 28px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 35% 30%,#fff8 0,transparent 30%),var(--seal);transition:transform .25s,opacity .25s}
.bl:after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:40px;background:var(--coverfg);opacity:.6}
.bl.pop i{transform:scale(1.5);opacity:0}.bl.pop:after{opacity:0}
@keyframes bob{50%{transform:translateY(-14px)}}
.pz{width:230px;padding:14px 14px 56px;background:#fff;color:#333;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:rotate(-3deg);transition:transform 1s .1s,opacity 1s}
.pz .ph{height:200px;background:var(--pic,linear-gradient(135deg,var(--accent),var(--seal))) center/cover;filter:brightness(0) blur(8px);transition:filter 2.4s}
.pz.dev .ph{filter:none}
.pz p{font:italic 1.2rem var(--serif);margin:14px 0 0;color:#333}
.pz.away{transform:translateY(-120vh) rotate(8deg);opacity:0}
.env{position:relative;width:270px;height:180px;background:color-mix(in srgb,var(--seal) 88%,#000);border-radius:4px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.env .flap{position:absolute;top:0;left:0;width:100%;height:105px;background:var(--seal);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;z-index:3}
.env .front{position:absolute;inset:0;background:color-mix(in srgb,var(--seal) 80%,#fff);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);z-index:2}
.env .letter{position:absolute;left:14px;right:14px;top:12px;bottom:12px;background:#fff;color:#333;z-index:1;transition:transform .9s .6s;display:flex;align-items:center;justify-content:center;font:400 1.4rem var(--serif);text-align:center;padding:8px}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .letter{transform:translateY(-95px)}
.bk{position:relative;width:210px;height:280px;perspective:900px;margin:10px auto}
.bk .pg,.bk .cv{position:absolute;inset:0;border-radius:2px 8px 8px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.bk .pg{background:var(--paper);color:var(--ink)}.bk .pg b,.bk .cv b{font:400 1.7rem/1.2 var(--serif)}
.bk .cv{background:var(--seal);color:#fff;transform-origin:left;transition:transform 1.5s cubic-bezier(.6,0,.3,1);backface-visibility:hidden;border-left:8px solid color-mix(in srgb,var(--seal) 70%,#000)}
.bk.open .cv{transform:rotateY(-172deg)}
.bar{position:absolute;left:0;right:0;height:0;background:#000;transition:height 1.2s;z-index:3}
.bar.t{top:0}.bar.b{bottom:0}.cin-on .bar{height:14vh}
.cin p,.cin h1{opacity:0;animation:fin 1.2s forwards;animation-delay:var(--d)}
.cin h1{font-size:clamp(2.6rem,10vw,4.6rem);margin:12px 0}
@keyframes fin{to{opacity:1}}
.passport-card{width:min(86vw,330px);min-height:430px;margin:auto;padding:24px 22px;border:2px solid var(--accent);border-radius:12px;background:linear-gradient(145deg,var(--cover2),var(--cover));color:var(--coverfg);box-shadow:0 18px 48px #0005;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transform:rotate(-2deg);}
.passport-card:before{content:"";position:absolute;inset:9px;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent);border-radius:7px;pointer-events:none}
.reveal-card{max-width:560px;padding:34px 22px;animation:softIn 1.2s both}.reveal-card h1,.starry-cover h1{font:clamp(2.5rem,9vw,4.5rem) var(--serif);margin:12px 0}.fade-reveal{animation:fadeAway .9s forwards}.zoom-emblem{font-size:3.4rem;color:var(--accent2);animation:pulse 2s infinite}.zoom-away{animation:zoomAway 1.1s forwards}.flip-card{width:min(78vw,300px);height:390px;position:relative;transform-style:preserve-3d;transition:transform 1s}.flip-card.flipped{transform:rotateY(180deg)}.flip-front,.flip-back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;border:2px solid var(--accent2);background:linear-gradient(145deg,var(--cover2),var(--cover));backface-visibility:hidden;color:var(--coverfg);box-shadow:0 12px 40px #0003}.flip-front span{font-size:4rem;color:var(--accent2)}.flip-front b,.flip-back b{font:2rem var(--serif)}.flip-back{transform:rotateY(180deg)}.starry-cover{max-width:600px;animation:softIn 1.2s both}.stars{font-size:2rem;letter-spacing:.15em;color:var(--accent2);margin-bottom:26px}.starry-away{animation:fadeAway 1.3s forwards}@keyframes softIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}@keyframes fadeAway{to{opacity:0;transform:scale(1.06)}}@keyframes zoomAway{to{opacity:0;transform:scale(1.6);filter:blur(8px)}}
.passport-emblem{font-size:2.8rem;color:var(--accent2);line-height:1}.passport-label{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase}.passport-names{font:400 2rem/1.15 var(--serif);text-align:center;max-width:260px}.passport-stamp{border:2px dashed var(--accent2);border-radius:50%;padding:14px 10px;transform:rotate(-12deg);font-size:.7rem;letter-spacing:.12em;text-align:center;margin-top:8px}.passport-card.opening{animation:passportOpen 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes passportOpen{to{transform:translateY(-25px) rotate(0) scale(1.06);opacity:0}}
/* Custom section background images */
section.has-bg{isolation:isolate;overflow:hidden;background-color:var(--paper)}
section.has-bg::before,footer.has-bg::before{content:"";position:absolute;inset:0;z-index:0;background-image:var(--section-image);background-size:cover;background-position:center;background-repeat:no-repeat;opacity:var(--section-opacity,.25);pointer-events:none}
footer.has-bg{position:relative;isolation:isolate;overflow:hidden;background-color:var(--alt)}
footer>*{position:relative;z-index:1}
.rich-answer p{margin:8px 0}.rich-answer ul,.rich-answer ol{padding-left:22px;margin:8px 0}.rich-answer a{color:var(--accent);text-decoration:underline}
.faq-editor{border:1px solid #d8dbe2;padding:10px;margin:10px 0;border-radius:8px}.rich-tools{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.rich-tools button{width:auto;padding:5px 10px;background:#f2f3f6;border:1px solid #d2d5dd;border-radius:4px;cursor:pointer}.rich-answer{min-height:76px;border:1px solid #c9ced6;background:#fff;color:#1f2a3a;padding:10px;border-radius:4px;outline-offset:2px}.rich-answer:empty:before{content:attr(data-placeholder);color:#7d8490}
.bg-options{display:grid;gap:12px}.bgrow{padding:10px;border:1px solid #d9dce3;border-radius:8px}.bgrow b{display:block;margin-bottom:5px}.bgrow label{margin:8px 0 4px}.bgrow input[type=range]{padding:0}
/* page */
#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(var(--alt),var(--paper));overflow:hidden}
#hero.hasphoto{background:linear-gradient(var(--ov,rgba(20,25,35,.5)),var(--ov,rgba(20,25,35,.5))),var(--pic) center/cover;color:#fff}
#hero.hasphoto .small,#hero.hasphoto .date{color:#fff}
#hero .small{color:var(--muted);letter-spacing:.03em}
#hero h1{font-size:clamp(3rem,13vw,5.5rem);line-height:1.05;margin:18px 0}
#hero .amp{display:block;font-style:italic;color:var(--accent);font-size:.5em;margin:4px 0}
#hero.hasphoto .amp{color:#fff}
#hero .date{font:1.5rem var(--serif);margin-top:18px}
#hero .date:before{content:"";display:block;width:56px;height:1px;background:var(--accent);margin:0 auto 18px}
.decor{position:absolute;pointer-events:none;z-index:1;width:min(54vw,260px)}
.decor svg{width:100%;height:auto;display:block}
.decor.tl{top:-6px;left:-6px}.decor.br{bottom:-6px;right:-6px;transform:rotate(180deg)}
.arch{position:absolute;left:50%;bottom:0;width:min(88vw,440px);height:86%;transform:translateX(-50%);border:1.5px solid var(--accent);border-bottom:0;border-radius:999px 999px 0 0;pointer-events:none;z-index:1}
.arch:before{content:"";position:absolute;inset:10px;border:1px solid var(--accent2);border-bottom:0;border-radius:999px 999px 0 0}
.frame{position:absolute;inset:18px;border:1px solid var(--accent);pointer-events:none;z-index:1}
.frame:before{content:"";position:absolute;inset:7px;border:1px solid var(--accent2)}
.conf{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}

(function () {

  const size = () => { cv.width = innerWidth; cv.height = innerHeight; }; size(); addEventListener('resize', size);
  const mk = () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height - cv.height, s: Math.random() * 9 + 6, v: Math.random() * 1 + .5, d: Math.random() * 2 - 1, a: Math.random() * 6, t: Math.random() * 6, c: Math.random() > .5 ? col : col2 });
  const P = Array.from({ length: k === 'sparkles' ? 40 : 28 }, mk);
  (function f() {
    x.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => {
      p.y += k === 'sparkles' ? .15 : p.v; p.x += Math.sin(p.t += .02) * .8 + p.d * .3; p.a += .02;
      if (p.y > cv.height + 20) Object.assign(p, mk(), { y: -20 });
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c;
      if (k === 'petals') { x.globalAlpha = .55; x.beginPath(); x.ellipse(0, 0, p.s * .45, p.s, 0, 0, 7); x.fill(); }
      else if (k === 'hearts') { x.globalAlpha = .5; const s = p.s; x.beginPath(); x.moveTo(0, s / 3); x.bezierCurveTo(-s, -s / 3, -s / 3, -s, 0, -s / 3); x.bezierCurveTo(s / 3, -s, s, -s / 3, 0, s / 3); x.fill(); }
      else if (k === 'confetti') { x.globalAlpha = .8; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
      else if (k === 'snow') { x.globalAlpha = .85; x.strokeStyle = col2; x.lineWidth = .6; x.beginPath(); x.arc(0, 0, p.s / 3, 0, 7); x.fillStyle = '#fff'; x.fill(); x.stroke(); }
      else { x.globalAlpha = .3 + .7 * Math.abs(Math.sin(p.t)); const s = p.s * .55; x.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? s * .25 : s; x.lineTo(Math.cos(i * Math.PI / 4) * r, Math.sin(i * Math.PI / 4) * r); } x.fill(); }
      x.restore();
    });
    requestAnimationFrame(f);
  })();
})();

  const cv = document.createElement('canvas'); cv.style.cssText = 'position:fixed;inset:0;z-index:60;pointer-events:none';

  const x = cv.getContext('2d'), cols = ['#e8b4b8', '#c9a45c', '#7bbfd4', '#f2a58e', '#9fc5a0', '#ffffff'];
  const P = Array.from({ length: 120 }, () => ({ x: cv.width / 2, y: cv.height * .55, vx: (Math.random() - .5) * 14, vy: -Math.random() * 16 - 4, r: Math.random() * 6 + 3, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6 }));
  let t = 0;
  (function f() {
    x.clearRect(0, 0, cv.width, cv.height);
    P.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; x.fillStyle = p.c; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
    if (++t < 110) requestAnimationFrame(f); else cv.remove();

}

  },
  passport(c) {
    c.innerHTML = `<div><p class="for">${FOR}</p><button class="cbtn" id="b" aria-label="Open the passport invitation"><div class="passport-card" id="passportCard"><div class="passport-emblem">✦</div><div class="passport-label">Wedding passport</div><div class="passport-label">The journey of</div><div class="passport-names">${esc(heading)}</div><div class="passport-label">${esc(C.dateText)}</div><div class="passport-stamp">ADMIT<br>ONE HEART<br>FOREVER</div></div></button><p class="tap">Tap your passport to begin the journey</p></div>`;
    $('b').onclick = () => { $('passportCard').classList.add('opening'); setTimeout(go, 1250); };
  },
  scratch(c) {
    c.innerHTML = `<div><p class="for">${FOR}</p><div class="sc"><div class="under"><b>${esc(heading)}</b><span>${esc(C.dateText)}</span></div><canvas id="cv" width="300" height="180"></canvas></div><p class="tap">Scratch to reveal</p></div>`;
    const cv = $('cv'), x = cv.getContext('2d'), g = x.createLinearGradient(0, 0, 300, 180);
    g.addColorStop(0, '#d9b868'); g.addColorStop(.5, '#f4e2a6'); g.addColorStop(1, '#b8923f');
    x.fillStyle = g; x.fillRect(0, 0, 300, 180); x.fillStyle = '#7a5d1e'; x.font = '600 22px sans-serif'; x.textAlign = 'center'; x.fillText('Scratch here', 150, 96);
    let down = false, n = 0, done = false;
    const at = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 300 / r.width, (e.clientY - r.top) * 180 / r.height]; };
    cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); };
    cv.onpointerup = () => down = false;
    cv.onpointermove = e => {
      if (!down || done) return;
      const [px, py] = at(e); x.globalCompositeOperation = 'destination-out'; x.beginPath(); x.arc(px, py, 22, 0, 7); x.fill();
      if (++n % 8) return;
      const d = x.getImageData(0, 0, 300, 180).data; let k = 0;
      for (let i = 3; i < d.length; i += 64) if (d[i] === 0) k++;
      if (k / (d.length / 64) > .45) { done = true; cv.style.opacity = 0; setTimeout(go, 1300); }
    };
  }
};
(OPEN[C.opening] || OPEN.doors)($('cover'));

// Countdown and calendar
function tick() {
  let s = Math.max(0, Math.floor((date - Date.now()) / 1000));
  $('count').innerHTML = [['Days', 86400], ['Hours', 3600], ['Minutes', 60], ['Seconds', 1]].map(([l, n]) => { const v = Math.floor(s / n); s -= v * n; return `<div><b>${v}</b><span>${l}</span></div>`; }).join('');
}
tick(); setInterval(tick, 1000);
$('cal').addEventListener('click', e => {
  e.preventDefault();
  const f = d => d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z', end = new Date(date.getTime() + 5 * 3600 * 1000);
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT', `DTSTART:${f(date)}`, `DTEND:${f(end)}`, `SUMMARY:${heading} ${C.eventLabel}`, `LOCATION:${C.venueName}, ${C.venueAddress}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'event.ics'; a.click();
});

// RSVP
document.querySelectorAll('[name=attending]').forEach(r => r.addEventListener('change', () => { $('more').style.display = document.querySelector('[name=attending]:checked').value === 'yes' ? '' : 'none'; }));
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const data = { name: $('name').value, email: $('email').value, website: $('website').value, attending: document.querySelector('[name=attending]:checked').value, guests: $('count2').value,
    meal: $('meal').value, song: $('song').value, message: $('msg').value, guestLink: guest, sentAt: new Date().toISOString(),
    site: location.hostname, pageUrl: location.origin + location.pathname, title: `${heading} ${C.eventLabel}`, dateText: C.dateText, timeText: C.timeText,
    venueName: C.venueName, venueAddress: C.venueAddress, notifyEmail: C.notifyEmail, senderName: C.senderName, emailNote: C.emailNote };
  try {
    if (C.rsvpEndpoint) await fetch(C.rsvpEndpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    else console.log('RSVP (not connected yet):', data);
  } catch (err) { alert('Sorry, we could not send your reply. Please try again.'); return; }
  $('form').style.display = 'none'; $('thanks').style.display = 'block';
  T('thanks', (data.attending === 'yes' ? `Thank you, ${data.name}. We can't wait to celebrate with you.` : `Thank you for letting us know, ${data.name}. You will be missed.`) + (C.rsvpEndpoint ? ` A copy of your reply is on its way to ${data.email}.` : ''));
});
</script>
